name: Keep backend awake

# Render's free tier spins the backend down after ~15 minutes of inactivity,
# which makes the next visitor wait ~30-60s for a cold start. This pings the
# health endpoint on a schedule so the service stays warm.

on:
  schedule:
    # Every 10 minutes. GitHub cron is UTC and may lag a few minutes under load.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="https://geometry-analysis-helper-1.onrender.com/api/health"
          echo "Pinging $URL"
          # Retry a few times: a cold start can take up to ~60s to respond.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 "$URL" || echo "000")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is awake."
              exit 0
            fi
            sleep 15
          done
          echo "Backend did not return 200 after retries."
          exit 1
