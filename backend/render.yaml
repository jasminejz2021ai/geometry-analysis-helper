# Render.com deployment config for the tutor backend (FastAPI / ASGI).
# The app talks to a local Ollama via LLM_API_BASE; in production point that at
# a public tunnel to your machine's Ollama (see DEPLOY.md).
services:
  - type: web
    name: geometry-analysis-helper
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Route AI to a direct OpenAI-compatible endpoint. Default: Google Gemini
      # (cheap/free, always-on cloud). Set LLM_API_KEY in the dashboard.
      - key: FALLBACK_PROVIDER
        value: openai
      - key: LLM_PROVIDER
        value: openai
      # Google Gemini's OpenAI-compatible base URL. (For a local Ollama tunnel
      # instead, override this in the dashboard with your tunnel URL + /v1.)
      - key: LLM_API_BASE
        value: https://generativelanguage.googleapis.com/v1beta/openai
      # Gemini API key from https://aistudio.google.com/apikey (set in dashboard).
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: LLM_VISION_MODEL
        value: gemini-3.6-flash
      # Comma-separated allowed origins. Set to your Vercel URL after deploy,
      # e.g. https://geometry-tutor.vercel.app
      - key: CORS_ORIGINS
        sync: false
