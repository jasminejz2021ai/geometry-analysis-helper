# Render.com deployment config for the tutor backend (FastAPI / ASGI).
# The app talks to a local Ollama via LLM_API_BASE; in production point that at
# a public tunnel to your machine's Ollama (see DEPLOY.md).
services:
  - type: web
    name: geometry-analysis-helper
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Route AI to a direct OpenAI-compatible endpoint (your Ollama tunnel).
      - key: FALLBACK_PROVIDER
        value: openai
      - key: LLM_PROVIDER
        value: openai
      # Public base URL of your Ollama's OpenAI-compatible API, e.g.
      # https://<your-tunnel>.ngrok-free.app/v1  (set in the Render dashboard)
      - key: LLM_API_BASE
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: qwen3:8b
      - key: LLM_VISION_MODEL
        value: qwen2.5vl:7b
      # Comma-separated allowed origins. Set to your Vercel URL after deploy,
      # e.g. https://geometry-tutor.vercel.app
      - key: CORS_ORIGINS
        sync: false
